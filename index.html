<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blank</title>
<meta name="description" content="A truly simple writing app in your browser. No setup, no clutter, just a focused space to write. Saves automatically on your device.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='1.5' width='10' height='13' rx='1.8' fill='white' stroke='%2318181b' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  /* zinc palette, same scale the original uses */
  --g50:#fafafa; --g100:#f4f4f5; --g200:#e4e4e7; --g300:#d4d4d8; --g400:#a1a1aa; --g500:#71717a; --g600:#52525b; --g700:#3f3f46; --g800:#27272a; --g900:#18181b; --g950:#09090b;
  --bg:#fff; --fg:var(--g900); --text:var(--g900); --muted:var(--g500); --faint:var(--g400);
  --border:var(--g200); --hover:var(--g100); --active:rgba(113,113,122,.07); --pop:#fff; --input:#fff;
  --code-bg:var(--g100); --code-fg:#c0393f; --link:var(--g600); --link-line:var(--g300); --syntax:var(--g400);
  --caret:#4787ee; --sel:rgba(71,135,238,.2);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font:"IBM Plex Sans",system-ui,sans-serif; --lh:1.65; --ls:.005em; --half:34ch;
  --scale:1; --wmul:1; --size:calc(16px*var(--scale));
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --sidebar:17rem;
}
@media (min-width:768px){:root{--size:calc(18px*var(--scale))}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:var(--g900); --fg:#c8c8d0; --text:var(--g100); --muted:var(--g400); --faint:var(--g500);
  --border:var(--g800); --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.07); --pop:var(--g800); --input:rgba(255,255,255,.04);
  --code-bg:var(--g800); --code-fg:#e0787d; --link:var(--g300); --link-line:var(--g600); --syntax:var(--g500);
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
:root[data-font="serif"]{--font:"Lora",Georgia,serif;--lh:1.7;--ls:0;--half:33ch}
:root[data-font="mono"]{--font:"Cousine",ui-monospace,monospace;--lh:1.8;--ls:0;--half:35ch}
:root[data-width="narrow"]{--wmul:.82}
:root[data-width="normal"]{--wmul:1}
:root[data-width="wide"]{--wmul:1.3}

*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:rgba(156,163,175,.3) transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid color-mix(in oklab,var(--g500) 50%,transparent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%)}
svg{display:block;flex-shrink:0}

/* ---------- floating toolbar ---------- */
.tools{position:fixed;top:max(.5rem,env(safe-area-inset-top));z-index:24;display:flex;align-items:center;gap:2px;opacity:.6;transition:opacity .5s,left .25s;font-size:.75rem}
.tools:hover,.tools:focus-within{opacity:1}
.tools.left{left:.5rem}
.tools.right{right:.5rem}
body.docked .tools.left{left:calc(var(--sidebar) + .5rem)}
body.typing .tools,body.typing .foot{opacity:0;pointer-events:none}
body.focus .tools,body.focus .foot{opacity:0}
body.focus .tools:hover,body.focus .foot:hover{opacity:.6}
.ib{height:2rem;min-width:2rem;padding:0 .4rem;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;color:var(--muted);transition:background-color .15s,color .15s}
.ib:hover,.ib[aria-expanded="true"]{background:var(--hover);color:var(--text)}
.ib:active{background:var(--active)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{color:var(--text)}
.status{color:var(--faint);padding:0 .5rem;white-space:nowrap}

/* ---------- editor ---------- */
main{position:absolute;inset:0;overflow-y:auto;padding:clamp(4.5rem,13vh,9rem) 5vw 40vh;transition:left .25s;scrollbar-width:none;-ms-overflow-style:none}
main::-webkit-scrollbar{display:none}
body.docked main{left:var(--sidebar)}
.col{width:min(100%,calc(var(--half)*2*var(--wmul)));margin:0 auto;font-family:var(--font);font-size:var(--size);line-height:var(--lh);letter-spacing:var(--ls)}
.stack{position:relative}
.hl,#editor{display:block;width:100%;font:inherit;letter-spacing:inherit;line-height:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;border:0;padding:0;margin:0}
.hl{position:absolute;inset:0;pointer-events:none;color:var(--fg);overflow:hidden}
#editor{position:relative;resize:none;overflow:hidden;outline:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--caret);min-height:60vh}
#editor::placeholder{color:var(--fg);-webkit-text-fill-color:var(--fg);opacity:.35}
#editor::selection{background:var(--sel);-webkit-text-fill-color:transparent}
/* live markdown styling: colour/stroke only, so glyph metrics never change */
.sx{color:var(--syntax)}
.hd,.bd{-webkit-text-stroke:.45px currentColor}
.ic{color:var(--code-fg)}
.lk{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--link-line);text-underline-offset:.14em}

#preview{display:none;color:var(--fg);overflow-wrap:break-word}
body.preview .stack{display:none}
body.preview #preview{display:block}
#preview h1,#preview h2,#preview h3,#preview h4{font-weight:700;line-height:1.3;padding-top:.6em;padding-bottom:.45em}
#preview h1{font-size:1.4em}#preview h2{font-size:1.2em}#preview h3,#preview h4{font-size:1.1em}
#preview>:first-child{padding-top:0}
#preview p{margin:0 0 1em}
#preview strong{font-weight:600}
#preview blockquote{margin:1em 0;padding-left:.8em;border-left:3px solid var(--g300)}
:root[data-theme="dark"] #preview blockquote{border-left-color:var(--g700)}
#preview code{font-family:Cousine,monospace;background:var(--code-bg);color:var(--code-fg);border-radius:4px;padding:.2em .3em .1em;font-size:calc(.8em + .5px)}
#preview pre{background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow:auto;margin:1em 0}
#preview pre code{background:none;padding:0;color:var(--fg)}
#preview hr{border:0;border-top:1px solid;opacity:.2;margin:.75em 0}
#preview a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--link-line);text-underline-offset:.14em}
#preview ul,#preview ol{padding-left:1.5em;margin:0 0 1em}
#preview li{margin-bottom:.25em}
#preview li.task{list-style:none;margin-left:-1.3em}
#preview li.task input{margin-right:.5em;accent-color:var(--text)}

/* ---------- footer ---------- */
.foot{position:fixed;left:0;right:0;bottom:max(.75rem,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:10;opacity:.7;transition:opacity .5s,left .25s;font-size:.75rem;color:var(--faint)}
body.docked .foot{left:var(--sidebar)}
.foot .in{pointer-events:auto;display:flex;gap:.9rem;align-items:center;font-variant-numeric:tabular-nums}
.goalbar{width:56px;height:4px;border-radius:4px;background:var(--border);overflow:hidden}
.goalbar i{display:block;height:100%;width:0;background:var(--muted);transition:width .3s}

/* ---------- sidebar ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:48}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(var(--sidebar),88vw);background:var(--bg);border-right:1px solid var(--border);z-index:49;transform:translateX(-101%);transition:transform .25s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;font-size:.8125rem}
.drawer.on{transform:none}
.drawer header{display:flex;gap:.25rem;align-items:center;padding:.5rem}
.drawer input[type=search]{flex:1;min-width:0;height:2rem;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;padding:0 .6rem;font:inherit}
.drawer input::placeholder{color:var(--faint)}
.list{flex:1;overflow:auto;padding:.25rem .5rem 1rem}
.item{display:flex;align-items:center;gap:.4rem;border-radius:8px;padding:.45rem .6rem;cursor:pointer;color:var(--muted);transition:background-color .15s,color .15s}
.item:hover{background:var(--hover);color:var(--text)}
.item.active{background:var(--active);color:var(--text)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:.75rem;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .del{opacity:0;width:1.6rem;height:1.6rem;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.item:hover .del,.item .del:focus-visible{opacity:1}
.item .del:hover{color:#ef4444;background:var(--hover)}
.empty{color:var(--faint);padding:1.5rem;text-align:center}
.drawer footer{padding:.5rem;border-top:1px solid var(--border);display:flex;gap:.25rem;flex-wrap:wrap}
.btn{height:2rem;padding:0 .7rem;border:1px solid var(--border);border-radius:8px;color:var(--text);background:transparent;font-size:.8125rem;transition:background-color .15s}
.btn:hover{background:var(--hover)}

/* ---------- popovers ---------- */
.pop{position:fixed;top:calc(max(.5rem,env(safe-area-inset-top)) + 2.2rem);right:.5rem;width:min(272px,calc(100vw - 1rem));background:var(--pop);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:.5rem;z-index:50;display:none;font-size:.8125rem;transform-origin:top right}
.pop.on{display:block;animation:pin .15s ease}
@keyframes pin{from{opacity:0;transform:scale(.97) translateY(-2px)}to{opacity:1;transform:none}}
.pop .row{padding:.35rem .35rem .5rem}
.pop h3{font-size:.75rem;font-weight:500;color:var(--muted);margin-bottom:.4rem}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--hover)}
.seg button{flex:1;height:1.7rem;border-radius:6px;color:var(--muted);transition:background-color .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--pop);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:rgba(255,255,255,.1)}
.pop input[type=number]{width:100%;height:2rem;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);padding:0 .6rem;font:inherit}
.menu{padding:.25rem}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;height:2rem;padding:0 .5rem;border-radius:6px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu kbd{font:.6875rem Cousine,monospace;color:var(--faint)}
.menu hr{border:0;height:1px;background:var(--border);margin:.25rem -.25rem}

.toast{position:fixed;left:50%;bottom:3.2rem;transform:translate(-50%,12px);background:var(--g900);color:#fff;padding:.5rem .85rem;border-radius:8px;font-size:.8125rem;opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;gap:.8rem;align-items:center;box-shadow:var(--shadow)}
:root[data-theme="dark"] .toast{background:var(--g100);color:var(--g900)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{text-decoration:underline;font-weight:600}

#printArea{display:none}
@media (max-width:640px){.status{display:none}}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .tools,.foot,main,.drawer,.scrim,.pop,.toast{display:none!important}
  #printArea{display:block;font-family:var(--font);font-size:12pt;line-height:1.6;color:#000}
  #printArea h1,#printArea h2,#printArea h3{break-after:avoid;font-weight:700;margin:1em 0 .4em}
  #printArea blockquote{border-left:3px solid #ccc;padding-left:.8em;margin:1em 0}
  #printArea pre,#printArea code{white-space:pre-wrap;font-family:Cousine,monospace}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="tools left" id="toolsL">
  <button class="ib" id="btnPages" aria-label="Pages" aria-expanded="false" title="Pages (Ctrl+/)">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
  </button>
  <button class="ib" id="btnNew" aria-label="New page" title="New page (Alt+N)">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="tools right" id="toolsR">
  <span class="status" id="saveStatus">Saved</span>
  <button class="ib" id="btnPreview" aria-label="Preview Markdown" aria-pressed="false" title="Preview (Alt+P)">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button class="ib" id="btnFocus" aria-label="Focus mode" title="Focus mode (Alt+F)">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="ib" id="btnSettings" aria-label="Appearance" aria-expanded="false" title="Appearance">
    <svg viewBox="0 0 24 24"><path d="M4 19 9.5 5h1L16 19M6.2 14h7.6M18 9v6M15 12h6"/></svg>
  </button>
  <button class="ib" id="btnMenu" aria-label="More" aria-expanded="false" title="More">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
  </button>
</div>

<main id="scroller">
  <div class="col">
    <div class="stack">
      <div class="hl" id="hl" aria-hidden="true"></div>
      <label class="sr" for="editor">Write here</label>
      <textarea id="editor" placeholder="Start writing…" spellcheck="true" autocapitalize="sentences" autofocus></textarea>
    </div>
    <article id="preview"></article>
  </div>
</main>

<div class="foot" id="foot"><div class="in">
  <span id="stats">0 words</span>
  <span id="read">0 min</span>
  <span class="goalbar" id="goalWrap" hidden title="Word goal progress"><i id="goalFill"></i></span>
</div></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Pages">
  <header>
    <input type="search" id="search" placeholder="Search pages…" aria-label="Search pages">
    <button class="ib" id="btnCloseDrawer" aria-label="Close sidebar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="list" id="list"></div>
  <footer>
    <button class="btn" id="btnNew2">+ New page</button>
    <button class="btn" id="btnBackup">Backup</button>
    <button class="btn" id="btnRestore">Restore</button>
  </footer>
</aside>

<div class="pop" id="popSettings" role="dialog" aria-label="Appearance">
  <div class="row"><h3>Theme</h3>
    <div class="seg" data-key="theme"><button data-v="system">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="row"><h3>Typeface</h3>
    <div class="seg" data-key="font"><button data-v="sans" style="font-family:'IBM Plex Sans'">Sans</button><button data-v="serif" style="font-family:Lora">Serif</button><button data-v="mono" style="font-family:Cousine">Mono</button></div></div>
  <div class="row"><h3>Text size</h3>
    <div class="seg" data-key="size"><button data-v="0.917">S</button><button data-v="1">M</button><button data-v="1.083">L</button><button data-v="1.2">XL</button></div></div>
  <div class="row"><h3>Line width</h3>
    <div class="seg" data-key="width"><button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></div></div>
  <div class="row"><h3>Scrolling</h3>
    <div class="seg" data-key="typewriter"><button data-v="off">Normal</button><button data-v="on">Typewriter</button></div></div>
  <div class="row"><h3>Word goal (0 = off)</h3>
    <input type="number" id="goalInput" min="0" step="50" value="0" aria-label="Word goal"></div>
</div>

<div class="pop menu" id="popMenu" role="menu" aria-label="More">
  <button data-act="copy">Copy text</button>
  <button data-act="pin">Pin / unpin page</button>
  <button data-act="find">Find &amp; replace <kbd>Ctrl H</kbd></button>
  <hr>
  <button data-act="txt">Download .txt</button>
  <button data-act="md">Download .md</button>
  <button data-act="pdf">Print / Save as PDF <kbd>Ctrl P</kbd></button>
  <button data-act="import">Open file…</button>
  <hr>
  <button data-act="date">Insert date &amp; time</button>
  <button data-act="shortcuts">Keyboard shortcuts</button>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>
<div id="printArea"></div>
<input type="file" id="fileOpen" accept=".txt,.md,.markdown,text/plain,text/markdown" multiple hidden>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const NOTES_KEY = "blank.notes.v1", SET_KEY = "blank.settings.v1";
const root = document.documentElement;

/* ---------- storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const blankNote = () => ({ id:uid(), text:"", created:Date.now(), updated:Date.now(), pinned:false });

let settings = Object.assign({ theme:"system", font:"sans", size:"1", width:"normal", goal:0, typewriter:"off", sidebar:false }, store.get(SET_KEY, {}));
let data = store.get(NOTES_KEY, null);
if (!data || !Array.isArray(data.notes) || !data.notes.length) data = { notes:[blankNote()], active:null };
if (!data.notes.find(n => n.id === data.active)) data.active = data.notes[0].id;
const current = () => data.notes.find(n => n.id === data.active);
const saveSettings = () => store.set(SET_KEY, settings);

/* ---------- settings ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const wide = () => innerWidth >= 1024;
function applySettings(){
  const dark = settings.theme === "dark" || (settings.theme === "system" && mq.matches);
  root.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name="theme-color"]').content = dark ? "#18181b" : "#ffffff";
  root.dataset.font = settings.font;
  root.dataset.width = settings.width;
  root.style.setProperty("--scale", settings.size);
  document.querySelectorAll(".seg").forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(String(settings[key]) === b.dataset.v)));
  });
  $("#goalInput").value = settings.goal || 0;
  updateStats(); autosize();
}
mq.addEventListener("change", applySettings);
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  settings[seg.dataset.key] = b.dataset.v; saveSettings(); applySettings();
}));
$("#goalInput").addEventListener("input", e => { settings.goal = Math.max(0, parseInt(e.target.value) || 0); saveSettings(); updateStats(); });

/* ---------- live markdown styling (colour only, metrics never change) ---------- */
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function inl(raw){
  let s = esc(raw);
  s = s.replace(/`([^`\n]+)`/g, '<span class="sx">`</span><span class="ic">$1</span><span class="sx">`</span>');
  s = s.replace(/(\*\*|__)([^*_\n]+?)\1/g, '<span class="sx">$1</span><span class="bd">$2</span><span class="sx">$1</span>');
  s = s.replace(/(\[)([^\]\n]+)(\]\()([^)\s]+)(\))/g, '<span class="sx">$1</span><span class="lk">$2</span><span class="sx">$3$4$5</span>');
  s = s.replace(/(~~)([^~\n]+)\1/g, '<span class="sx">$1</span>$2<span class="sx">$1</span>');
  return s;
}
function highlight(text){
  let inCode = false;
  return text.split("\n").map(l => {
    if (/^```/.test(l)) { inCode = !inCode; return `<span class="sx">${esc(l)}</span>`; }
    if (inCode) return `<span class="ic">${esc(l)}</span>`;
    let m;
    if ((m = l.match(/^(#{1,6}\s+)(.*)$/))) return `<span class="sx">${esc(m[1])}</span><span class="hd">${inl(m[2])}</span>`;
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) return `<span class="sx">${esc(l)}</span>`;
    if ((m = l.match(/^(\s*(?:>\s?)+)(.*)$/))) return `<span class="sx">${esc(m[1])}</span>${inl(m[2])}`;
    if ((m = l.match(/^(\s*(?:[-*]|\d+\.)\s(?:\[[ xX]\]\s)?)(.*)$/))) return `<span class="sx">${esc(m[1])}</span>${inl(m[2])}`;
    return inl(l);
  }).join("\n") + "\n";
}

/* ---------- editor ---------- */
const ed = $("#editor"), scroller = $("#scroller"), hl = $("#hl");
function paint(){ hl.innerHTML = highlight(ed.value); }
function autosize(){ ed.style.height = "auto"; ed.style.height = Math.max(ed.scrollHeight, innerHeight * .6) + "px"; }
let saveTimer = null;
const setStatus = t => { $("#saveStatus").textContent = t; };
function persist(){ setStatus(store.set(NOTES_KEY, data) ? "Saved" : "Not saved: storage full"); }
function scheduleSave(){ setStatus("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }
const words = t => (t.trim().match(/\S+/g) || []).length;
function updateStats(){
  const t = ed.value, w = words(t);
  $("#stats").textContent = `${w.toLocaleString()} word${w === 1 ? "" : "s"}`;
  $("#read").textContent = `${Math.max(w ? 1 : 0, Math.round(w / 230))} min`;
  const g = settings.goal, wrap = $("#goalWrap");
  wrap.hidden = !g;
  if (g) $("#goalFill").style.width = Math.min(100, w / g * 100) + "%";
}
function titleOf(n){
  const line = n.text.split("\n").find(l => l.trim());
  return line ? line.replace(/^#+\s*/, "").trim().slice(0, 80) : "Untitled";
}
const setDocTitle = n => { const t = titleOf(n); document.title = t === "Untitled" ? "Blank" : t + " · Blank"; };

ed.addEventListener("input", () => {
  const n = current(); n.text = ed.value; n.updated = Date.now();
  paint(); autosize(); updateStats(); scheduleSave(); setDocTitle(n);
  document.body.classList.add("typing");
  if (settings.typewriter === "on") typewriter();
});
function typewriter(){
  const lh = parseFloat(getComputedStyle(ed).lineHeight) || 28;
  const lines = ed.value.slice(0, ed.selectionStart).split("\n").length;
  scroller.scrollTop = ed.offsetTop + lines * lh - innerHeight / 2.2;
}
["mousemove","pointerdown","touchstart","keydown"].forEach(ev => addEventListener(ev, e => {
  if (ev === "keydown" && !(e.key === "Escape" || e.ctrlKey || e.metaKey)) return;
  document.body.classList.remove("typing");
}, { passive:true }));
// pointer movement (real) brings the toolbar back; typing hides it
addEventListener("mousemove", () => document.body.classList.remove("typing"), { passive:true });

ed.addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); ed.setRangeText("  ", ed.selectionStart, ed.selectionEnd, "end"); ed.dispatchEvent(new Event("input"));
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    const s = ed.selectionStart, v = ed.value;
    const ls = v.lastIndexOf("\n", s - 1) + 1, line = v.slice(ls, s);
    const m = line.match(/^(\s*)([-*]|\d+\.)\s(\[[ xX]\]\s)?(.*)$/);
    if (m && s === ed.selectionEnd) {
      e.preventDefault();
      if (!m[4]) { ed.setRangeText("", ls, s, "end"); ed.setRangeText("\n", ls, ls, "end"); }
      else {
        let b = m[2]; if (/\d+\./.test(b)) b = (parseInt(b) + 1) + ".";
        ed.setRangeText("\n" + m[1] + b + " " + (m[3] ? "[ ] " : ""), s, s, "end");
      }
      ed.dispatchEvent(new Event("input"));
    }
  }
});
addEventListener("resize", autosize);
document.fonts && document.fonts.ready.then(autosize);

function loadActive(){
  const n = current(); ed.value = n.text; paint(); autosize(); updateStats(); setDocTitle(n);
  if (document.body.classList.contains("preview")) renderPreview();
  scroller.scrollTop = 0;
}

/* ---------- pages ---------- */
function newPage(){
  const cur = current();
  if (cur && !cur.text.trim()) { closeOverlay(); setPreview(false); ed.focus(); return; }
  data.notes.unshift(blankNote()); data.active = data.notes[0].id;
  persist(); loadActive(); renderList(); closeOverlay(); setPreview(false); ed.focus();
}
function switchTo(id){ data.active = id; persist(); loadActive(); renderList(); closeOverlay(); if (!document.body.classList.contains("preview")) ed.focus(); }
let lastDeleted = null;
function deletePage(id){
  const i = data.notes.findIndex(n => n.id === id); if (i < 0) return;
  lastDeleted = { note:data.notes[i], index:i };
  data.notes.splice(i, 1);
  if (!data.notes.length) data.notes.push(blankNote());
  if (data.active === id) data.active = data.notes[Math.min(i, data.notes.length - 1)].id;
  persist(); loadActive(); renderList();
  toast("Page deleted", () => {
    data.notes.splice(Math.min(lastDeleted.index, data.notes.length), 0, lastDeleted.note);
    data.active = lastDeleted.note.id; persist(); loadActive(); renderList();
  });
}
function renderList(){
  const q = $("#search").value.trim().toLowerCase();
  const items = data.notes.filter(n => !q || n.text.toLowerCase().includes(q)).sort((a, b) => (b.pinned - a.pinned) || (b.updated - a.updated));
  const list = $("#list");
  if (!items.length) { list.innerHTML = '<div class="empty">No pages found.</div>'; return; }
  list.innerHTML = items.map(n => {
    const d = new Date(n.updated).toLocaleDateString(undefined, { month:"short", day:"numeric" });
    return `<div class="item ${n.id === data.active ? "active" : ""}" data-id="${n.id}" tabindex="0" role="button">
      <div class="body"><div class="t">${n.pinned ? "📌 " : ""}${esc(titleOf(n))}</div><div class="m">${d} · ${words(n.text)} words</div></div>
      <button class="del" data-del="${n.id}" aria-label="Delete page" title="Delete"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`;
  }).join("");
}
$("#list").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); deletePage(del.dataset.del); return; }
  const it = e.target.closest(".item"); if (it) switchTo(it.dataset.id);
});
$("#list").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("item")) { e.preventDefault(); switchTo(e.target.dataset.id); }
});
$("#search").addEventListener("input", renderList);

/* ---------- sidebar & popovers ---------- */
const drawer = $("#drawer"), scrim = $("#scrim");
function sidebarOpen(){ return drawer.classList.contains("on"); }
function openSidebar(){
  renderList(); drawer.classList.add("on"); closePops();
  document.body.classList.toggle("docked", wide()); scrim.classList.toggle("on", !wide());
  $("#btnPages").setAttribute("aria-expanded", "true");
  settings.sidebar = true; saveSettings();
  if (!wide()) setTimeout(() => $("#search").focus(), 150);
}
function closeSidebar(){
  drawer.classList.remove("on"); scrim.classList.remove("on"); document.body.classList.remove("docked");
  $("#btnPages").setAttribute("aria-expanded", "false");
  settings.sidebar = false; saveSettings();
}
function closeOverlay(){ closePops(); if (!wide() && sidebarOpen()) { drawer.classList.remove("on"); scrim.classList.remove("on"); $("#btnPages").setAttribute("aria-expanded","false"); } }
function closePops(){ ["#popSettings","#popMenu"].forEach(s => $(s).classList.remove("on")); $("#btnSettings").setAttribute("aria-expanded","false"); $("#btnMenu").setAttribute("aria-expanded","false"); }
function togglePop(pop, btn){ const was = $(pop).classList.contains("on"); closePops(); if (!was) { $(pop).classList.add("on"); $(btn).setAttribute("aria-expanded","true"); } }
$("#btnPages").onclick = () => sidebarOpen() ? closeSidebar() : openSidebar();
$("#btnCloseDrawer").onclick = closeSidebar; scrim.onclick = closeSidebar;
$("#btnSettings").onclick = e => { e.stopPropagation(); togglePop("#popSettings", "#btnSettings"); };
$("#btnMenu").onclick = e => { e.stopPropagation(); togglePop("#popMenu", "#btnMenu"); };
document.addEventListener("click", e => { if (!e.target.closest(".pop") && !e.target.closest(".tools")) closePops(); });
$("#btnNew").onclick = newPage; $("#btnNew2").onclick = newPage;
addEventListener("resize", () => { if (sidebarOpen()) { document.body.classList.toggle("docked", wide()); scrim.classList.toggle("on", !wide()); } });

/* ---------- modes ---------- */
function setPreview(on){
  document.body.classList.toggle("preview", on);
  $("#btnPreview").setAttribute("aria-pressed", String(on));
  if (on) renderPreview(); else ed.focus();
}
$("#btnPreview").onclick = () => setPreview(!document.body.classList.contains("preview"));
function setFocus(on){ document.body.classList.toggle("focus", on); if (on) toast("Focus mode on. Press Alt+F or Esc to exit."); }
$("#btnFocus").onclick = () => setFocus(!document.body.classList.contains("focus"));

/* ---------- markdown → html (preview + print) ---------- */
function mdInline(s){
  s = esc(s); const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|#)/i.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : m);
  s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`);
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g, "$1<em>$2</em>").replace(/(^|[^_\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src){
  const lines = src.replace(/\r/g, "").split("\n"); let out = "", i = 0, para = [];
  const flush = () => { if (para.length) out += "<p>" + para.map(mdInline).join("<br>") + "</p>"; para = []; };
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) { flush(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>"; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { flush(); out += `<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out += "<hr>"; i++; continue; }
    if (/^>\s?/.test(l)) { flush(); const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      flush(); const tag = /^\s*\d+\./.test(l) ? "ol" : "ul"; let items = "";
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let t = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""), cls = "", box = ""; const tm = t.match(/^\[([ xX])\]\s+(.*)$/);
        if (tm) { cls = ' class="task"'; box = `<input type="checkbox" disabled${tm[1] !== " " ? " checked" : ""}>`; t = tm[2]; }
        items += `<li${cls}>${box}${mdInline(t)}</li>`; i++;
      }
      out += `<${tag}>${items}</${tag}>`; continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush(); return out;
}
function renderPreview(){ $("#preview").innerHTML = md(ed.value) || '<p style="opacity:.35">Nothing to preview yet.</p>'; }

/* ---------- export / import ---------- */
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type:type || "text/plain;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileName = () => (titleOf(current()).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "untitled");
function importText(name, text){
  const n = blankNote(); n.text = text; data.notes.unshift(n); data.active = n.id; persist(); loadActive(); renderList(); toast("Opened " + name);
}
$("#fileOpen").addEventListener("change", async e => { for (const f of e.target.files) importText(f.name, await f.text()); e.target.value = ""; });
$("#fileRestore").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j.notes || !Array.isArray(j.notes)) throw 0;
    let added = 0; const have = new Set(data.notes.map(n => n.id));
    j.notes.forEach(n => { if (typeof n.text === "string" && !have.has(n.id)) { data.notes.push({ id:n.id || uid(), text:n.text, created:n.created || Date.now(), updated:n.updated || Date.now(), pinned:!!n.pinned }); added++; } });
    persist(); renderList(); toast(`Restored ${added} page${added === 1 ? "" : "s"}`);
  } catch { toast("That doesn't look like a backup file"); }
  e.target.value = "";
});
$("#btnBackup").onclick = () => { download(`blank-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data, null, 2), "application/json"); toast("Backup downloaded"); };
$("#btnRestore").onclick = () => $("#fileRestore").click();
function printPage(){ $("#printArea").innerHTML = md(ed.value); print(); }
addEventListener("beforeprint", () => { $("#printArea").innerHTML = md(ed.value); });

function findReplace(){
  const f = prompt("Find:"); if (!f) return;
  const count = ed.value.split(f).length - 1;
  if (!count) { toast("No matches"); return; }
  const r = prompt(`${count} match${count === 1 ? "" : "es"}. Replace with (leave blank to just jump to the first):`);
  if (r === null) return;
  if (r === "") { const i = ed.value.indexOf(f); setPreview(false); ed.focus(); ed.setSelectionRange(i, i + f.length); return; }
  ed.value = ed.value.split(f).join(r); ed.dispatchEvent(new Event("input")); toast(`Replaced ${count}`);
}

$("#popMenu").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; closePops();
  switch (b.dataset.act) {
    case "copy": try { await navigator.clipboard.writeText(ed.value); toast("Copied to clipboard"); } catch { ed.select(); document.execCommand("copy"); toast("Copied"); } break;
    case "pin": { const n = current(); n.pinned = !n.pinned; persist(); renderList(); toast(n.pinned ? "Page pinned" : "Page unpinned"); break; }
    case "find": findReplace(); break;
    case "txt": download(fileName() + ".txt", ed.value); break;
    case "md": download(fileName() + ".md", ed.value, "text/markdown;charset=utf-8"); break;
    case "pdf": printPage(); break;
    case "import": $("#fileOpen").click(); break;
    case "date": { setPreview(false); const t = new Date().toLocaleString(undefined, { dateStyle:"full", timeStyle:"short" }); ed.focus(); ed.setRangeText(t, ed.selectionStart, ed.selectionEnd, "end"); ed.dispatchEvent(new Event("input")); break; }
    case "shortcuts": alert("Keyboard shortcuts\n\nAlt+N  New page\nCtrl/Cmd+/  Pages sidebar\nAlt+P  Markdown preview\nAlt+F  Focus mode\nCtrl/Cmd+H  Find & replace\nCtrl/Cmd+P  Print / PDF\nCtrl/Cmd+S  Save now\nEsc  Close panels / exit focus"); break;
  }
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  $("#toastMsg").textContent = msg;
  const u = $("#toastUndo"); u.hidden = !undo; u.onclick = () => { undo(); hideToast(); };
  $("#toast").classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, undo ? 6000 : 2600);
}
const hideToast = () => $("#toast").classList.remove("on");

/* ---------- shortcuts ---------- */
addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.key === "Escape") {
    if (document.querySelector(".pop.on")) closePops();
    else if (!wide() && sidebarOpen()) closeSidebar();
    else if (document.body.classList.contains("focus")) setFocus(false);
    else if (document.body.classList.contains("preview")) setPreview(false);
    return;
  }
  if (mod && e.key === "/") { e.preventDefault(); sidebarOpen() ? closeSidebar() : openSidebar(); }
  else if (mod && k === "s") { e.preventDefault(); clearTimeout(saveTimer); persist(); toast("Saved"); }
  else if (mod && k === "p") { e.preventDefault(); printPage(); }
  else if (mod && k === "h") { e.preventDefault(); findReplace(); }
  else if (e.altKey && e.code === "KeyN") { e.preventDefault(); newPage(); }
  else if (e.altKey && e.code === "KeyP") { e.preventDefault(); setPreview(!document.body.classList.contains("preview")); }
  else if (e.altKey && e.code === "KeyF") { e.preventDefault(); setFocus(!document.body.classList.contains("focus")); }
});

/* sync tabs + flush on exit */
addEventListener("storage", e => {
  if (e.key === NOTES_KEY && e.newValue) {
    try {
      const d = JSON.parse(e.newValue);
      if (d && Array.isArray(d.notes) && d.notes.length) {
        const a = data.active; data = d;
        data.active = data.notes.find(n => n.id === a) ? a : data.notes[0].id;
        if (document.activeElement !== ed) loadActive();
        renderList();
      }
    } catch {}
  }
});
addEventListener("beforeunload", () => { clearTimeout(saveTimer); persist(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(saveTimer); persist(); } });

/* ---------- init ---------- */
applySettings(); loadActive(); renderList();
if (settings.sidebar && wide()) openSidebar();
if (!current().text) ed.focus();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
